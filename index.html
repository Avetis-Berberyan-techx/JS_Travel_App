<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Agent</title>
  </head>
  <body>
    <div class="wrapper">
      <!-- Header Block -->
      <header class="header">
        <h1 class="header__title">Travel Agent</h1>
      </header>

      <!-- Main Block -->
      <main class="main">
        <!-- Search Element -->
        <section class="main__search">
          <input
            type="text"
            class="main__search-input"
            id="country-input"
            placeholder="Enter Country"
            value=""
          />
          <button
            type="button"
            class="main__search-button"
            id="country-search-button"
          >
            Search
          </button>
        </section>

        <!-- Display Element -->
        <h2>Country</h2>
        <section class="main__display"></section>

        <!-- Liked Section -->
        <h2>liked</h2>
        <section class="main__liked"></section>

        <!-- Saved Section -->
        <h2>Saved</h2>
        <section class="main__saved"></section>
      </main>
    </div>
  </body>
</html>
