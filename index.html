            class="main__search-button"
            id="country-search-button"

            Search
          </button>
        </section>

        <!-- Liked Section -->
        <section class="main__navigator">
          <button type="button" id="liked-list"><h2>liked</h2></button>
          <button type="button" id="saved-list"><h2>saved</h2></button>
        </section>
        <section class="main__liked">
          <table class="table">
            <thead class="table__head">
              <tr class="table__row">
                <th class="table__cell">Country</th>
                <th class="table__cell">Flag</th>
                <th class="table__cell">Capital</th>
                <th class="table__cell">Population</th>
                <th class="table__cell">Region</th>
                <th class="table__cell">Currency</th>

                <th class="table__cell">Timezone</th>

        <section class="main__saved">

                <th class="table__cell">Flag</th>
